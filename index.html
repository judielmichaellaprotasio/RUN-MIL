
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>RUN MIL!</title>

    <link rel="stylesheet" href="style.css?v=20261128a">
    <link rel="stylesheet" href="menu-art.css?v=20261126e">
    <link rel="stylesheet" href="modeinfo.css?v=20261126e">
    <link rel="stylesheet" href="howto.css?v=20261126e">
    <script src="perf.js?v=20261126e"></script>
    <script src="duo.js?v=20261126e"></script>
</head>

<body>

    <!-- START GATE: one click / key press -> fullscreen -> loading video -->
    <div id="start-gate" class="screen hidden">
        <img class="gate-logo" src="visuals/images/logo.png" alt="RUN MIL!">
        <p class="gate-text">CLICK OR PRESS ANY KEY TO START</p>
        <small class="gate-sub">The game opens in fullscreen</small>
    </div>

    <!-- INTRO: comic story video, after the "tap to start" screen. Has SKIP and "don't show again". -->
    <div id="intro-screen" class="hidden">
        <video id="intro-video" playsinline preload="auto"><source src="visuals/videos/INTRO.mp4" type="video/mp4"></video>
        <div id="intro-snd" hidden>&#128266; TAP ANYWHERE FOR SOUND</div>
        <div class="intro-bar">
            <label class="intro-never"><input type="checkbox" id="intro-never"><span>DON'T SHOW AGAIN</span></label>
            <button type="button" id="intro-skip">SKIP &#9654;&#9654;</button>
        </div>
    </div>

    <!-- MISSION: one sentence + OKAY, shown after the intro and before the loading video -->
    <div id="goal-screen" class="hidden">
        <div class="goal-bg"></div>
        <div class="goal-embers" id="goal-embers"></div>
        <div class="goal-eyes"><i style="left:6%;top:62%"></i><i style="left:14%;top:30%"></i><i style="left:82%;top:24%"></i><i style="left:91%;top:66%"></i><i style="left:48%;top:86%"></i></div>
        <div class="goal-card">
            <div class="goal-stamp">MISSION</div>
            <p class="goal-text" id="goal-text" aria-live="polite"></p>
            <div class="goal-icons">
                <div class="gi" id="gi-friends"><div class="faces"><img src="visuals/heroines/h1/face.png" alt=""><img src="visuals/heroines/h2/face.png" alt="" onerror="this.style.display='none'"><img src="visuals/heroines/h3/face.png" alt=""><img src="visuals/heroines/h4/face.png" alt=""></div><b>FIND COMPANIONS</b></div>
                <div class="gi" id="gi-monsters"><div class="mon"><i></i><i></i></div><b>BEAT MONSTERS</b></div>
                <div class="gi" id="gi-exit"><div class="exit">EXIT</div><b>ESCAPE</b></div>
            </div>
            <button type="button" id="goal-ok">OKAY</button>
        </div>
    </div>

    <!-- SCREEN 1: LOADING VIDEO -->

 <!-- SCREEN 1: LOADING VIDEO -->
<div id="loading-screen" class="screen">
    <video id="loading-video" muted playsinline preload="auto">
        <source src="visuals/videos/LOADING%20PAGE.mp4" type="video/mp4">
    </video>
</div>

<!-- SCREEN 2: TITLE VIDEO -->
<div id="title-screen" class="screen hidden">
    <video id="title-video" muted loop playsinline preload="auto">
        <source src="visuals/videos/TITLE PAGE.mp4" type="video/mp4">
    </video>
</div>


    <!-- SCREEN 3: MAIN MENU -->

    <div id="main-menu" class="screen hidden">
      <div class="menu-stage">

        <!-- PROFILE (top left) -->
        <div class="pnl profile" id="profile-btn">
            <div class="avatar"><canvas class="avatar-gif" id="avatar-img" width="180" height="180" role="img" aria-label="Your avatar"></canvas></div>
            <div class="profile-info">
                <div class="level" id="level-text">Lv. 1</div>
                <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div><span id="xp-text">0 / 100 XP</span></div>
            </div>
        </div>

        <!-- CURRENCY (top centre) -->
        <div class="pill coin-pill">
            <img src="visuals/images/icon-coin.png" alt="">
            <span id="coin-count">1,250</span>
        </div>
        <div class="pill gem-pill">
            <img src="visuals/images/icon-gem.png" alt="">
            <span id="gem-count">50</span>
            <button class="plus" id="gem-plus" aria-label="Earn gems">+</button>
        </div>

        <!-- TOP RIGHT: ACHIEVEMENTS, HEROINES, LOCATIONS, SETTINGS -->
        <div class="topbtns">
            <button class="icon-btn achievements" id="achievements-btn">
                <img src="visuals/images/icon-trophy.png" alt=""><span>ACHIEVEMENTS</span>
                <i class="badge" id="ach-badge" hidden></i>
            </button>
            <button class="icon-btn heroes" id="heroes-btn" hidden>
                <svg class="ic" viewBox="0 0 100 100" aria-hidden="true"><g fill="#3b4166" stroke="#aeb6e6" stroke-width="3" stroke-linejoin="round"><circle cx="50" cy="30" r="17"/><path d="M33 26c2-14 12-19 20-18 10 1 17 9 14 22-4-7-9-10-16-10-8 0-14 2-18 6z"/><path d="M22 96c0-22 12-38 28-38s28 16 28 38z"/></g><text x="50" y="86" text-anchor="middle" font-family="Teko, Impact, sans-serif" font-weight="700" font-size="40" fill="#fff" stroke="#10163c" stroke-width="3" paint-order="stroke">?</text></svg><span>HEROINES</span>
            </button>
            <button class="icon-btn howto" id="howto-btn" aria-label="How to play">
                <span class="q">?</span><span>HOW TO PLAY</span>
            </button>
            <button class="icon-btn settings" id="settings-btn">
                <img src="visuals/images/icon-gear.png" alt=""><span>SETTINGS</span>
            </button>
        </div>

        <!-- LOGO -->
        <h1 class="sr-only">RUN MIL! - Run. Survive. Escape.</h1>
        <img class="logo" src="visuals/images/logo.png" alt="RUN MIL! Run. Survive. Escape.">

        <!-- LEFT MENU -->
        <button class="menu-btn mb1" id="customize-btn">
            <img src="visuals/images/icon-shirt.png" alt=""><b>CHARACTER<br>CUSTOMIZATION</b><em>&#10095;</em>
        </button>
        <button class="menu-btn mb2" id="shop-btn">
            <img src="visuals/images/icon-shield.png" alt=""><b>EQUIPMENT<br>SHOP</b><em>&#10095;</em>
        </button>
        <button class="menu-btn mb3" id="collect-btn">
            <span class="mi">&#128214;</span><b>COLLECTION<br>BOOK</b><em>&#10095;</em>
        </button>

        <!-- CENTRE CHARACTER (animated GIF) -->
        <canvas class="hero" id="hero" width="560" height="560" role="img" aria-label="Player character running"></canvas>

        <!-- GAME MODES: pick one, then press PLAY -->
        <button class="mode-card mode-endless" id="mode-endless" data-mode="endless" aria-pressed="false"><span class="sr-only">ENDLESS RUN</span></button>
        <button class="mode-card mode-survival" id="mode-survival" data-mode="survival" aria-pressed="false"><span class="sr-only">MONSTER SURVIVAL</span></button>

        <!-- PLAY -->
        <div class="play-wrap">
            <button id="play-btn" class="play-button" aria-label="Play"><span class="sr-only">PLAY</span></button>
        </div>

        <!-- LOCATION BOARD (right) -->
        <aside class="board">
            <button class="board-title" id="map-btn" aria-label="Open location map">PANABO CITY</button>
            <button class="loc selected" data-loc="park"><img src="visuals/images/loc-park.png" alt=""><span>Panabo City Park</span></button>
            <button class="loc locked" data-loc="dnsc"><img src="visuals/images/loc-dnsc.png" alt=""><span>DNSC Campus</span><img class="lk" src="visuals/images/icon-lock.png" alt="Locked"></button>
            <button class="loc locked" data-loc="mangrove"><img src="visuals/images/loc-mangroves.png" alt=""><span>Panabo Mangrove Forest</span><img class="lk" src="visuals/images/icon-lock.png" alt="Locked"></button>
            <button class="loc locked" data-loc="seawall"><img src="visuals/images/loc-seawall.png" alt=""><span>Panabo Seawall</span><img class="lk" src="visuals/images/icon-lock.png" alt="Locked"></button>
            <button class="loc locked more" data-loc="locked"><img class="lock" src="visuals/images/icon-lock.png" alt=""><span>More Locations to Unlock!</span></button>
        </aside>

        <!-- DAILY MISSIONS (bottom left) -->
        <button class="pnl missions" id="missions-btn">
            <img class="m-icon" src="visuals/images/icon-mission.png" alt="">
            <div class="m-body">
                <div class="m-title">DAILY MISSIONS</div>
                <div class="m-text" id="mission-text">Collect 50 Coins</div>
                <div class="m-bar"><div class="m-fill" id="mission-fill"></div><span id="mission-count">0 / 50</span></div>
            </div>
            <div class="m-reward"><img src="visuals/images/icon-coin.png" alt=""><b>+100</b></div>
        </button>

        <!-- PLAYER STATS (right) -->
        <button class="pnl stats" id="stats-btn" aria-label="Open player profile">
            <img class="crown" src="visuals/images/icon-crown.png" alt="">
            <div class="s-title"><img src="visuals/images/icon-chart.png" alt="">PLAYER STATS</div>
            <div class="s-row"><span>Best Score</span><b id="stat-best">: 0</b></div>
            <div class="s-row"><span>Longest Run</span><b id="stat-run">: 0 m</b></div>
            <div class="s-row"><span>Total Coins</span><b id="stat-coins">: 1,250</b></div>
            <div class="s-row"><span>Total Play Time</span><b id="stat-time">: 0h 0m</b></div>
        </button>

        <!-- BOTTOM: where you are, help, tagline -->
        <div class="keep">Keep Running, Mil!</div>

        <div class="toast" id="menu-toast"></div>
      </div>
    </div>


    <!-- GAME (opens on top of the menu when PLAY is pressed) -->
    <iframe id="game-frame" title="RUN MIL! game" allow="fullscreen; autoplay" hidden></iframe>

    <!-- JAVASCRIPT -->

    <div id="rotate-hint"><div>&#8635;<br>Please rotate your device<br>to landscape</div></div>

    <script src="assets.js?v=20261126e"></script>
    <script src="visuals/audio/sounds.js?v=20261126e"></script>
    <script src="audio.js?v=20261126e"></script>
    <script src="characters.js?v=20261126e"></script>
    <script src="character.js?v=20261126e"></script>
    <script src="hero.js?v=20261126e"></script>
    <script src="script.js?v=20261128b"></script>
    <script src="collect.js?v=20261126e"></script>
    <script src="screens.js?v=20261126e"></script>
    <script src="modeinfo.js?v=20261126e"></script>
    <script src="howto.js?v=20261126e"></script>

</body>

</html>
