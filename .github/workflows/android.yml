name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build the www folder (game files + visuals)
      run: |
        if [ ! -f www/index.html ]; then
          mkdir -p www/visuals
          # a "visuals" folder, if you uploaded one, goes first; every other folder at the top level is a visuals sub-folder
          if [ -d visuals ]; then cp -a visuals/. www/visuals/ && rm -rf visuals; fi
          for d in */; do
            d="${d%/}"
            case "$d" in
              www|android|node_modules|java) ;;
              *) mv "$d" www/visuals/ ;;
            esac
          done
          [ -d java ] && mv java www/
          for f in *; do
            case "$f" in
              www|android|node_modules|package.json|package-lock.json|capacitor.config.json|README.md) ;;
              *) mv "$f" www/ ;;
            esac
          done
        fi
        test -f www/index.html
        ls www/visuals

    - name: Check the game files (fix upper/lower case, list anything missing)
      run: |
        python3 - <<'PY'
        import os, re, shutil
        from urllib.parse import unquote
        root = "www"
        pat = re.compile(r'''["'(]((?:\./)?visuals/[^"'()\s?#]+\.(?:png|jpg|jpeg|gif|webp|mp3|ogg|m4a|wav|mp4|woff2|svg))''', re.I)
        refs = set()
        for f in os.listdir(root):
            if f.endswith((".html", ".js", ".css")):
                s = open(os.path.join(root, f), errors="ignore").read()
                for m in pat.finditer(s): refs.add(unquote(m.group(1)).lstrip("./"))
        missing = []
        for r in sorted(refs):
            p = os.path.join(root, r)
            if os.path.exists(p): continue
            d, b = os.path.split(p)
            hit = [x for x in os.listdir(d) if x.lower() == b.lower()] if os.path.isdir(d) else []
            if hit:
                shutil.copy(os.path.join(d, hit[0]), p); print("case fixed:", r, "<-", hit[0])
            else:
                missing.append(r)
        print(len(refs), "files referenced;", len(missing), "missing")
        for r in missing: print("MISSING:", r)
        PY

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: npm install

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build debug APK
      run: |
        chmod +x android/gradlew
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RUN-MIL-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
