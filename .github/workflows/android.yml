name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build the www folder (game files + visuals)
      run: |
        if [ ! -f www/index.html ]; then
          mkdir -p www/visuals
          for d in audio backgrounds images monsters obstacles player skins survival victory videos; do
            [ -d "$d" ] && mv "$d" www/visuals/
          done
          [ -d java ] && mv java www/
          for f in *; do
            case "$f" in
              www|android|node_modules|package.json|package-lock.json|capacitor.config.json|README.md) ;;
              *) mv "$f" www/ ;;
            esac
          done
        fi
        test -f www/index.html
        ls www | head -30
        ls www/visuals

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: npm install

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build debug APK
      run: |
        chmod +x android/gradlew
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RUN-MIL-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
